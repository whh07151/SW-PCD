name: Document validation

on:
  pull_request:
    branches: [main]
    paths:
      - "**.pdf"
      - "**.pptx"
      - "scripts/validate_documents.py"
      - ".github/workflows/document-validation.yml"
  push:
    branches: [main]
    paths:
      - "**.pdf"
      - "**.pptx"
      - "scripts/validate_documents.py"
      - ".github/workflows/document-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate PDF and PowerPoint files
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate document containers
        run: python3 scripts/validate_documents.py
